# Abode Power Tariffs -- daily rate table (flex-table-card)
#
# Requires Flex Table Card (https://github.com/custom-cards/flex-table-card),
# installed separately through HACS.
#
# Change sensor.electricity_today_schedule below to your own channel's
# entity id: sensor.<your channel name>_today_schedule.
#
# Reads the 'periods' attribute -- one entry per period as entered, each
# with start, end, rate_name, per_kwh, demand_period, demand_rate_per_kw_month.

type: custom:flex-table-card
title: Today's rates
entities:
  include: sensor.electricity_today_schedule
columns:
  - name: Time
    data: periods
    modify: x.start + '–' + x.end
  - name: Rate
    data: periods
    modify: x.rate_name
  - name: Price
    data: periods
    modify: (x.per_kwh * 100).toFixed(2) + ' c/kWh'
  - name: Demand
    data: periods
    modify: "x.demand_period ? '$' + x.demand_rate_per_kw_month.toFixed(2) + '/kW' : ''"
