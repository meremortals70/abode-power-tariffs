# Abode Power Tariffs -- daily rate chart
#
# A coloured 24-hour bar, cheapest to most expensive, with a line at the
# current time. Requires ApexCharts Card (https://github.com/RomRider/apexcharts-card),
# installed separately through HACS.
#
# Change sensor.electricity_today_schedule below to your own channel's
# entity id: sensor.<your channel name>_today_schedule.
#
# The bar's height and colour both track a 0-100 ranking, cheapest at 0,
# most expensive at 100 -- not the literal price, which is why the y-axis
# is hidden. What each slice actually costs belongs in a table underneath,
# not squeezed onto a bar with 96 slices in it -- see the same sensor's
# own 'table' attribute, and a plain markdown card to show it.

type: custom:apexcharts-card
graph_span: 24h
span:
  start: day
now:
  show: true
  label: Now
header:
  show: true
  title: Today's rates
apex_config:
  chart:
    toolbar:
      show: false
  plotOptions:
    bar:
      columnWidth: 100%
  dataLabels:
    enabled: false
  yaxis:
    show: false
  tooltip:
    enabled: true
series:
  - entity: sensor.electricity_today_schedule
    type: column
    name: Rate
    data_generator: |
      const segs = entity.attributes.segments || [];
      if (segs.length === 0) return [];
      // Ranked by price plus the demand rate declared on it.
      const scores = segs.map(s => s.per_kwh + (s.demand_rate_per_kw_month || 0));
      const min = Math.min(...scores);
      const max = Math.max(...scores);
      const range = (max - min) || 1;
      // The colour is set directly on each point (fillColor), rather than
      // through plotOptions.bar.colors.ranges with distributed: true --
      // that combination, on a datetime x-axis, coloured bars wrong in
      // practice, confirmed against a real dashboard and not explained by
      // anything wrong in this ranking (proven correct against real data
      // before this was changed). Setting fillColor directly on each
      // point is a plain, standard ApexCharts feature and does not depend
      // on distributed mode or a ranges lookup at all.
      const colourFor = (rank) => {
        if (rank < 20) return '#2e7d32';
        if (rank < 40) return '#8bc34a';
        if (rank < 60) return '#fdd835';
        if (rank < 80) return '#fb8c00';
        return '#e53935';
      };
      return segs.map((s, i) => {
        const rank = Math.round(((scores[i] - min) / range) * 100);
        return {
          x: new Date(s.start_time).getTime(),
          y: rank,
          fillColor: colourFor(rank),
        };
      });
